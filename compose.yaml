name: aivoa-round-one
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aivoa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: complaints
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivoa -d complaints"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
